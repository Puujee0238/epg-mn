name: Update Weekly EPG

on:
  schedule:
    # Thursday 15:00 GMT+8 == Thursday 07:00 UTC
    # - cron: "0 7 * * 4"
    - cron: "0 14 * * 0" # Sunday 22:00 GMT+8 == Sunday 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find working Mongolia proxies
        if: ${{ vars.USE_PROXY != 'false' }}
        run: python proxy_finder.py

      - name: Run EPG scraper
        env:
          USE_PROXY: ${{ vars.USE_PROXY != 'false' }}
        run: python epg.py

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- weekly_epg_updated.xml; then
            echo "No changes to weekly_epg_updated.xml, skipping commit."
          else
            git add weekly_epg_updated.xml
            git commit -m "chore: weekly EPG update ($(date -u +'%Y-%m-%d'))"
            git push
          fi

